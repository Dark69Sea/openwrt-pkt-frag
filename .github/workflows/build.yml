# .github/workflows/build.yml
name: Build pkt-frag for Google Router (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ "openwrt/**" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk flex bison libssl-dev wget unzip python3 rsync file ccache curl git
          
      - name: Clone OpenWrt buildroot
        run: |
          git clone --branch openwrt-23.05 --depth=1 https://github.com/openwrt/openwrt.git buildroot
          
      - name: Copy package to buildroot
        run: |
          cp -r ${{ github.workspace }}/openwrt buildroot/package/pkt-frag
          
      - name: Update feeds
        run: |
          cd buildroot
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: Configure buildroot for MediaTek Filogic
        run: |
          cd buildroot
          cat >> .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_PACKAGE_kmod-pkt-frag=m
          CONFIG_PACKAGE_pkt-frag-daemon=m
          CONFIG_PACKAGE_luci-app-pkt-frag=m
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          
      - name: Build (this takes 30-60 minutes)
        run: |
          cd buildroot
          make -j$(nproc) V=s
          
      - name: Find and verify artifacts
        run: |
          find buildroot/bin -name "*.ipk" -type f | head -30
          
      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-pkt-frag-ipks-arm64
          path: |
            buildroot/bin/packages/aarch64_generic/base/kmod-pkt-frag*.ipk
            buildroot/bin/packages/aarch64_generic/base/pkt-frag-daemon*.ipk
            buildroot/bin/packages/aarch64_generic/luci/luci-app-pkt-frag*.ipk
            buildroot/bin/targets/mediatek/filogic/packages/kmod-pkt-frag*.ipk
            buildroot/bin/targets/mediatek/filogic/packages/pkt-frag-daemon*.ipk
            buildroot/bin/targets/mediatek/filogic/packages/luci-app-pkt-frag*.ipk
